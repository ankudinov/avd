---
name: publish typedoc
on:
  push:
    branches: [ devel, typedoc-preview ]
    paths:
    - typedoc/src/**
    - .github/workflows/publish-pages.yml
    - typedoc/typedoc-from-schema.py
    - mdbook/mdbook-from-schema.py
  workflow_dispatch:
    branches: [ devel, typedoc-preview ]
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:

      - name: Checkout code ✅
        uses: actions/checkout@v4

      - name: Setup Python3 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # - name: setup Node
      #   uses: actions/setup-node@v5

      # - name: Build Site
      #   run: |
      #     pip3 install -r ansible_collections/arista/avd/requirements-dev.txt --upgrade
      #     python3 ./typedoc/typedoc-from-schema.py
      #     npm install --save-dev typedoc
      #     npx typedoc --options typedoc/typedoc.config.jsonc
      #     du -hs ./typedoc/site/

      - name: Install latest mdbook
        run: |
          tag=$(curl 'https://api.github.com/repos/rust-lang/mdbook/releases/latest' | jq -r '.tag_name')
          url="https://github.com/rust-lang/mdbook/releases/download/${tag}/mdbook-${tag}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSL $url | tar -xz --directory=./mdbook
          echo `pwd`/mdbook >> $GITHUB_PATH
      - name: Build Book
        run: |
          python3 ./mdbook/mdbook-from-schema.py
          cd mdbook
          mdbook build

      - name: Setup Pages 📖
        uses: actions/configure-pages@v5

      - name: Upload artifact 🔼
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./typedoc/site/

      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
